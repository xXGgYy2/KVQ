    test-SDR-only:
        type: FusionDataset
        args:
            phase: test
            anno_file: /mnt/data/local-disk3/xyy/dataset/LIVE_Paired_Comparison_HDRvsSDR_Database/JOD_separate_out.txt
            data_prefix: /mnt/data/local-disk3/xyy/dataset/LIVE_Paired_Comparison_HDRvsSDR_Database/open-sourced_HDR10
            get_close_matches: 1
            sample_types:
                fragments:
                    vqa_input: Resize
                    fragments_h: 14 #7
                    fragments_w: 14 #7
                    fsize_h: 32
                    fsize_w: 32
                    aligned: 8
                    clip_len: 32 #32
                    frame_interval: 2
                    t_frag: 8     #8
                    num_clips: 1
model:
    type: KVQ
    args:
        backbone:
            fragments:
                checkpoint: True
                act_mag_flag: True
                cross_layer: [0, 0, 1, 1]
        vqa_head:
            in_channels: 768
            hidden_channels: 64
            
optimizer:
    lr: !!float 5e-4
    backbone_lr_mult: !!float 0.1
    wd: 0.05

load_path: ./pretrained_weight/swin_tiny_patch244_window877_kinetics400_1k.pth
test_load_path: /mnt/data/local-disk2/xyy/KVQ/results/KVQ_train_enhance_fine/last.pth
